<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 500 500" width="500" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>:root { color-scheme: only light; }</style>

    <!-- Dégradé Vert Métallique Global -->
    <linearGradient id="grad-green" gradientUnits="userSpaceOnUse" x1="65" y1="60" x2="430" y2="365">
      <stop offset="0%" stop-color="#a8e016" />
      <stop offset="30%" stop-color="#3c6604" />
      <stop offset="55%" stop-color="#9bd812" />
      <stop offset="80%" stop-color="#2a4a02" />
      <stop offset="100%" stop-color="#8cc60f" />
    </linearGradient>

    <!-- Dégradé Argent Métallique Global -->
    <linearGradient id="grad-silver" gradientUnits="userSpaceOnUse" x1="65" y1="205" x2="415" y2="440">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#b8b8b8" />
      <stop offset="55%" stop-color="#f5f5f5" />
      <stop offset="80%" stop-color="#9e9e9e" />
      <stop offset="100%" stop-color="#e0e0e0" />
    </linearGradient>

    <!-- Ombre portée globale pour détacher l'ensemble du fond -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#drop-shadow)">
    <!-- ========================================================= -->
    <!-- 1. LETTRES SANS CONTOURS (Fusion naturelle au repos)      -->
    <!-- ========================================================= -->

    <!-- CHEVRON VERT (Issu du T) -->
    <g>
      <!-- Branche supérieure du T -->
      <polygon points="75,176 308,176 308,194 68.44,194" fill="url(#grad-green)">
        <animate attributeName="points" dur="4.2s" repeatCount="indefinite"
          keyTimes="0; 0.25; 0.45; 0.75; 0.92; 1"
          values="
            75,176 308,176 308,194 68.44,194;
            75,176 308,176 308,194 68.44,194;
            145,250 222,165 240,181 178,250;
            145,250 222,165 240,181 178,250;
            75,176 308,176 308,194 68.44,194;
            75,176 308,176 308,194 68.44,194" />
      </polygon>

      <!-- Jambe du T -->
      <polygon points="204,194 230,194 202,365 176,365" fill="url(#grad-green)">
        <animate attributeName="points" dur="4.2s" repeatCount="indefinite"
          keyTimes="0; 0.25; 0.45; 0.75; 0.92; 1"
          values="
            204,194 230,194 202,365 176,365;
            204,194 230,194 202,365 176,365;
            145,250 178,250 240,319 222,335;
            145,250 178,250 240,319 222,335;
            204,194 230,194 202,365 176,365;
            204,194 230,194 202,365 176,365" />
      </polygon>
    </g>

    <!-- CHEVRON GRIS (Issu du L) -->
    <g>
      <!-- Jambe verticale du L -->
      <polygon points="278,205 304,205 273,363 247,363" fill="url(#grad-silver)">
        <animate attributeName="points" dur="4.2s" repeatCount="indefinite"
          keyTimes="0; 0.25; 0.45; 0.75; 0.92; 1"
          values="
            278,205 304,205 273,363 247,363;
            278,205 304,205 273,363 247,363;
            260,250 337,165 355,181 293,250;
            260,250 337,165 355,181 293,250;
            278,205 304,205 273,363 247,363;
            278,205 304,205 273,363 247,363" />
      </polygon>

      <!-- Base horizontale du L -->
      <polygon points="251,345 414.54,345 402.5,363 247,363" fill="url(#grad-silver)">
        <animate attributeName="points" dur="4.2s" repeatCount="indefinite"
          keyTimes="0; 0.25; 0.45; 0.75; 0.92; 1"
          values="
            251,345 414.54,345 402.5,363 247,363;
            251,345 414.54,345 402.5,363 247,363;
            260,250 293,250 355,319 337,335;
            260,250 293,250 355,319 337,335;
            251,345 414.54,345 402.5,363 247,363;
            251,345 414.54,345 402.5,363 247,363" />
      </polygon>
    </g>

    <!-- ========================================================= -->
    <!-- 2. SEGMENTS DE CERCLE SANS CONTOURS (Fixes au-dessus)     -->
    <!-- ========================================================= -->

    <!-- ARC SUPÉRIEUR VERT -->
    <path d="M 75 176 A 190 190 0 0 1 430 310 L 410 310 A 170 170 0 0 0 96.95 176 Z" 
          fill="url(#grad-green)" />

    <!-- ARC INFÉRIEUR GRIS -->
    <path d="M 65 215 L 85 215 A 170 170 0 0 0 390.98 345 L 414.54 345 A 190 190 0 0 1 65 215 Z" 
          fill="url(#grad-silver)" />
  </g>
</svg>
